name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle 8.9 installé par l'action : fonctionne même sans gradlew dans le dépôt.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Tests unitaires + APK debug
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mon-budget-dz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier les rapports de test (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests/
